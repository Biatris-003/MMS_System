<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="1000" height="1160">
  <defs>
    <!-- Metallic Helmet Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E7ED" />
      <stop offset="30%" stop-color="#CCD2DC" />
      <stop offset="85%" stop-color="#BAC0CC" />
      <stop offset="100%" stop-color="#ACB2BF" />
    </linearGradient>

    <!-- Antenna & Ear Parts Gradient -->
    <linearGradient id="partsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D5DBE5" />
      <stop offset="100%" stop-color="#9AA2B3" />
    </linearGradient>

    <!-- Visor Background Screen -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D384A" />
      <stop offset="40%" stop-color="#252F3F" />
      <stop offset="100%" stop-color="#1B222E" />
    </linearGradient>

    <!-- Neon Lime Green for MMS -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64FB88" />
      <stop offset="50%" stop-color="#46ED74" />
      <stop offset="100%" stop-color="#25D65A" />
    </linearGradient>
  </defs>

  <g id="robot-mascot">
    <!-- LEFT ANTENNA -->
    <!-- Base Mount -->
    <rect x="92" y="105" width="34" height="42" rx="6" fill="url(#partsGrad)" stroke="#747E90" stroke-width="3" />
    <!-- Rod -->
    <rect x="105" y="48" width="8" height="60" rx="4" fill="#D3D8E2" stroke="#747E90" stroke-width="3" />
    <!-- Top Ball -->
    <circle cx="109" cy="42" r="14" fill="#E2E6EE" stroke="#747E90" stroke-width="3.5" />
    <circle cx="105" cy="38" r="4" fill="#FFFFFF" opacity="0.9" />

    <!-- RIGHT ANTENNA -->
    <!-- Base Mount -->
    <rect x="374" y="105" width="34" height="42" rx="6" fill="url(#partsGrad)" stroke="#747E90" stroke-width="3" />
    <!-- Rod -->
    <rect x="387" y="48" width="8" height="60" rx="4" fill="#D3D8E2" stroke="#747E90" stroke-width="3" />
    <!-- Top Ball -->
    <circle cx="391" cy="42" r="14" fill="#E2E6EE" stroke="#747E90" stroke-width="3.5" />
    <circle cx="387" cy="38" r="4" fill="#FFFFFF" opacity="0.9" />

    <!-- LEFT EAR -->
    <rect x="42" y="235" width="22" height="100" rx="8" fill="url(#partsGrad)" stroke="#677182" stroke-width="3.5" />

    <!-- RIGHT EAR -->
    <rect x="436" y="235" width="22" height="100" rx="8" fill="url(#partsGrad)" stroke="#677182" stroke-width="3.5" />

    <!-- ROBOT HELMET (Metallic dome top, vertical sides, rounded base) -->
    <path
      d="M 58 250
         C 58 140, 130 102, 250 102
         C 370 102, 442 140, 442 250
         L 442 400
         C 442 422, 424 438, 400 438
         L 100 438
         C 76 438, 58 422, 58 400
         Z"
      fill="url(#helmetGrad)"
      stroke="#737D8F"
      stroke-width="5.5"
      stroke-linejoin="round"
    />

    <!-- INNER VISOR (Dark Rounded Arch Screen) -->
    <path
      d="M 94 250
         C 94 170, 148 142, 250 142
         C 352 142, 406 170, 406 250
         L 406 332
         C 406 339, 400 344, 392 344
         L 108 344
         C 100 344, 94 339, 94 332
         Z"
      fill="url(#visorGrad)"
      stroke="#2B3547"
      stroke-width="5"
    />

    <!-- BUBBLY NEON GREEN 'MMS' TEXT -->
    <g transform="translate(0, 0)">
      <!-- First 'M' -->
      <path
        d="M 112 328
           L 112 195
           C 112 181, 122 174, 135 174
           C 147 174, 156 181, 163 194
           L 173 218
           L 183 194
           C 190 181, 199 174, 211 174
           C 224 174, 234 181, 234 195
           L 234 328
           L 207 328
           L 207 225
           L 187 262
           C 181 272, 165 272, 159 262
           L 139 225
           L 139 328
           Z"
        fill="url(#neonGreen)"
        stroke="#104A23"
        stroke-width="4.5"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- Second 'M' -->
      <path
        d="M 223 328
           L 223 195
           C 223 181, 233 174, 246 174
           C 258 174, 267 181, 274 194
           L 284 218
           L 294 194
           C 301 181, 310 174, 322 174
           C 335 174, 345 181, 345 195
           L 345 328
           L 318 328
           L 318 225
           L 298 262
           C 292 272, 276 272, 270 262
           L 250 225
           L 250 328
           Z"
        fill="url(#neonGreen)"
        stroke="#104A23"
        stroke-width="4.5"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- 'S' -->
      <path
        d="M 388 206
           C 383 188, 371 176, 350 176
           C 328 176, 315 191, 315 210
           C 315 232, 330 244, 352 253
           C 369 260, 381 269, 381 285
           C 381 301, 366 315, 344 315
           C 325 315, 312 301, 309 285
           L 285 292
           C 291 318, 313 333, 344 333
           C 379 333, 406 311, 406 280
           C 406 251, 388 238, 363 228
           C 346 222, 337 213, 337 203
           C 337 193, 346 186, 359 186
           C 372 186, 382 193, 385 202
           Z"
        fill="url(#neonGreen)"
        stroke="#104A23"
        stroke-width="4.5"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    </g>

    <!-- 'ACADEMY' CHIN TEXT -->
    <text
      x="250"
      y="412"
      text-anchor="middle"
      font-family="'Liberation Sans', 'DejaVu Sans', Arial, sans-serif"
      font-weight="900"
      font-size="52"
      fill="#283344"
      letter-spacing="4"
    >ACADEMY</text>
  </g>

  <!-- 'for Science & Technology' SUBTITLE -->
  <text
    x="250"
    y="515"
    text-anchor="middle"
    font-family="'Liberation Sans', 'DejaVu Sans', Arial, sans-serif"
    font-weight="400"
    font-size="34"
    fill="#475569"
    letter-spacing="0.8"
  >for Science &amp; Technology</text>
</svg>
